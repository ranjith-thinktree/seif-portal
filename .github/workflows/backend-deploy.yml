name: Deploy Backend to EC2 (Secure SSM)

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

env:
  AWS_REGION: ap-south-2
  INSTANCE_ID: i-07952bda3b3b73510

jobs:
  deploy:
    name: Deploy to EC2 via AWS Systems Manager
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci --production

      - name: Create .env file
        working-directory: ./backend
        run: |
          cat > .env << EOF
          # Database Configuration
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=3306
          DB_NAME=seif
          DB_USER=admin
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}

          # JWT Configuration
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_EXPIRY=24h
          REFRESH_TOKEN_EXPIRY=7d

          # Server Configuration
          PORT=5000
          NODE_ENV=production
          FRONTEND_URL=http://seif-portal-frontend.s3-website.ap-south-2.amazonaws.com

          # Email Configuration (Gmail)
          SMTP_HOST=smtp.gmail.com
          SMTP_PORT=587
          SMTP_SECURE=false
          SMTP_USER=${{ secrets.GMAIL_USER }}
          SMTP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_FROM=${{ secrets.GMAIL_USER }}

          # File Upload Configuration
          UPLOAD_DIR=./uploads
          MAX_FILE_SIZE=10485760

          # CORS
          ALLOWED_ORIGINS=http://seif-portal-frontend.s3-website.ap-south-2.amazonaws.com
          EOF

      - name: Create deployment package
        run: |
          cd backend
          tar -czf ../backend-deploy.tar.gz \
            --exclude='node_modules/.cache' \
            --exclude='logs' \
            --exclude='uploads' \
            --exclude='.git' \
            .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        run: |
          aws s3 cp backend-deploy.tar.gz s3://${{ secrets.S3_BUCKET_NAME }}/deployments/backend-$(date +%Y%m%d-%H%M%S).tar.gz
          aws s3 cp backend-deploy.tar.gz s3://${{ secrets.S3_BUCKET_NAME }}/deployments/backend-latest.tar.gz

      - name: Deploy via Systems Manager
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ env.INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "SEIF Backend Deployment - ${{ github.sha }}" \
            --parameters 'commands=[
              "echo \"Starting deployment...\"",
              "cd /home/ubuntu/seif-portal/backend",
              "pm2 stop seif-backend || true",
              "mkdir -p /tmp/seif-backup",
              "cp -r /home/ubuntu/seif-portal/backend /tmp/seif-backup/backend-$(date +%Y%m%d-%H%M%S) || true",
              "aws s3 cp s3://${{ secrets.S3_BUCKET_NAME }}/deployments/backend-latest.tar.gz /tmp/backend-deploy.tar.gz",
              "tar -xzf /tmp/backend-deploy.tar.gz -C /home/ubuntu/seif-portal/backend",
              "cd /home/ubuntu/seif-portal/backend",
              "npm ci --production",
              "pm2 restart seif-backend || pm2 start src/server.js --name seif-backend",
              "pm2 save",
              "rm /tmp/backend-deploy.tar.gz",
              "echo \"Deployment completed successfully!\""
            ]' \
            --output text \
            --query 'Command.CommandId')
          
          echo "Command ID: $COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> $GITHUB_ENV
          
          # Wait for command to complete
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ env.INSTANCE_ID }}" \
            --region ${{ env.AWS_REGION }}

      - name: Get deployment output
        if: always()
        run: |
          aws ssm get-command-invocation \
            --command-id "${{ env.COMMAND_ID }}" \
            --instance-id "${{ env.INSTANCE_ID }}" \
            --region ${{ env.AWS_REGION }} \
            --output text \
            --query '[Status,StandardOutputContent,StandardErrorContent]'

      - name: Verify deployment
        run: |
          echo "Waiting for backend to start..."
          sleep 15
          
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.EC2_HOST }}:5000/health || echo "000")
          
          if [ "$RESPONSE" = "200" ]; then
            echo "✅ Backend is healthy!"
          else
            echo "❌ Backend health check failed (HTTP $RESPONSE)"
            exit 1
          fi

      - name: Rollback on failure
        if: failure()
        run: |
          echo "⚠️ Deployment failed! Attempting rollback..."
          
          ROLLBACK_CMD=$(aws ssm send-command \
            --instance-ids "${{ env.INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "SEIF Backend Rollback" \
            --parameters 'commands=[
              "cd /home/ubuntu/seif-portal",
              "LATEST_BACKUP=$(ls -t /tmp/seif-backup/ | head -1)",
              "if [ -d \"/tmp/seif-backup/$LATEST_BACKUP\" ]; then",
              "  rm -rf /home/ubuntu/seif-portal/backend",
              "  cp -r /tmp/seif-backup/$LATEST_BACKUP /home/ubuntu/seif-portal/backend",
              "  cd /home/ubuntu/seif-portal/backend",
              "  pm2 restart seif-backend",
              "  echo \"Rollback completed\"",
              "else",
              "  echo \"No backup found\"",
              "fi"
            ]' \
            --output text \
            --query 'Command.CommandId')
          
          echo "Rollback Command ID: $ROLLBACK_CMD"

      - name: Deployment summary
        if: always()
        run: |
          echo "### 🚀 Backend Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Method:** AWS Systems Manager (Secure, No SSH)" >> $GITHUB_STEP_SUMMARY
          echo "- **Instance:** ${{ env.INSTANCE_ID }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
          cd backend
          npm ci --production

      - name: Create .env file
        run: |
          cd backend
          cat > .env << EOF
          # Database Configuration
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=3306
          DB_NAME=seif
          DB_USER=admin
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}

          # JWT Configuration
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_EXPIRY=24h
          REFRESH_TOKEN_EXPIRY=7d

          # Server Configuration
          PORT=5000
          NODE_ENV=production
          FRONTEND_URL=http://seif-portal-frontend.s3-website.ap-south-2.amazonaws.com

          # Email Configuration (Gmail)
          SMTP_HOST=smtp.gmail.com
          SMTP_PORT=587
          SMTP_SECURE=false
          SMTP_USER=${{ secrets.GMAIL_USER }}
          SMTP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_FROM=${{ secrets.GMAIL_USER }}

          # File Upload Configuration
          UPLOAD_DIR=./uploads
          MAX_FILE_SIZE=10485760

          # CORS
          ALLOWED_ORIGINS=http://seif-portal-frontend.s3-website.ap-south-2.amazonaws.com
          EOF

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Create backup on EC2
        run: |
          ssh ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
            cd /home/ubuntu/seif-portal
            if [ -d backend_backup ]; then
              rm -rf backend_backup
            fi
            if [ -d backend ]; then
              cp -r backend backend_backup
              echo "✅ Backup created"
            fi
          ENDSSH

      - name: Deploy to EC2
        run: |
          echo "📦 Syncing files to EC2..."
          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude 'logs/*' \
            --exclude 'uploads/*' \
            --exclude 'coverage' \
            --exclude '.env' \
            backend/ ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/home/ubuntu/seif-portal/backend/

          echo "✅ Files synced successfully"

      - name: Install dependencies and restart on EC2
        run: |
          ssh ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
            set -e
            cd /home/ubuntu/seif-portal/backend
            
            echo "📦 Installing dependencies..."
            npm ci --production
            
            echo "🔄 Restarting PM2 process..."
            if pm2 describe seif-backend > /dev/null 2>&1; then
              pm2 restart seif-backend
            else
              pm2 start src/server.js --name seif-backend
            fi
            
            pm2 save
            echo "✅ Backend restarted successfully"
          ENDSSH

      - name: Verify deployment
        run: |
          echo "⏳ Waiting for backend to start..."
          sleep 15

          ssh ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
            echo "📊 PM2 Status:"
            pm2 list
            
            echo ""
            echo "📝 Recent logs:"
            pm2 logs seif-backend --lines 20 --nostream
            
            echo ""
            echo "✅ Backend deployment verification complete"
          ENDSSH

      - name: Rollback on failure
        if: failure()
        run: |
          echo "❌ Deployment failed! Rolling back..."
          ssh ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
            cd /home/ubuntu/seif-portal
            if [ -d backend_backup ]; then
              rm -rf backend
              mv backend_backup backend
              pm2 restart seif-backend
              echo "✅ Rollback completed"
            else
              echo "⚠️  No backup found"
            fi
          ENDSSH

      - name: Deployment summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Backend deployed successfully to EC2!"
            echo "🔗 Backend URL: http://${{ secrets.EC2_HOST }}:5000"
            echo "🔗 Health Check: http://${{ secrets.EC2_HOST }}:5000/health"
          else
            echo "❌ Backend deployment failed"
            echo "Check the logs above for details"
          fi
