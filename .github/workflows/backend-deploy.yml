name: Deploy Backend to EC2 (SSM)

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

env:
  AWS_REGION: ap-south-2
  INSTANCE_ID: i-07952bda3b3b73510

jobs:
  deploy:
    name: Deploy to EC2 via Systems Manager
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci --production --legacy-peer-deps

      - name: Create .env file
        working-directory: ./backend
        run: |
          cat > .env << EOF
          # Database Configuration
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=3306
          DB_NAME=seif
          DB_USER=admin
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}

          # JWT Configuration
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_EXPIRY=24h
          REFRESH_TOKEN_EXPIRY=7d

          # Server Configuration
          PORT=5000
          NODE_ENV=production
          FRONTEND_URL=http://seif-portal-frontend.s3-website.ap-south-2.amazonaws.com

          # Email Configuration
          SMTP_HOST=smtp.gmail.com
          SMTP_PORT=587
          SMTP_SECURE=false
          SMTP_USER=${{ secrets.GMAIL_USER }}
          SMTP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_FROM=${{ secrets.GMAIL_USER }}

          # File Upload Configuration
          UPLOAD_DIR=./uploads
          MAX_FILE_SIZE=10485760

          # CORS
          ALLOWED_ORIGINS=http://seif-portal-frontend.s3-website.ap-south-2.amazonaws.com
          EOF

      - name: Create deployment package
        run: |
          cd backend
          tar -czf ../backend-deploy.tar.gz \
            --exclude='logs' \
            --exclude='uploads' \
            --exclude='coverage' \
            --exclude='.git' \
            --exclude='*.log' \
            .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        run: |
          aws s3 cp backend-deploy.tar.gz s3://${{ secrets.S3_BUCKET_NAME }}/deployments/backend-$(date +%Y%m%d-%H%M%S).tar.gz
          aws s3 cp backend-deploy.tar.gz s3://${{ secrets.S3_BUCKET_NAME }}/deployments/backend-latest.tar.gz
          echo "✅ Deployment package uploaded to S3"

      - name: Deploy via Systems Manager
        run: |
          echo "🚀 Starting deployment via AWS Systems Manager..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ env.INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "SEIF Backend Deployment - ${{ github.sha }}" \
            --parameters 'commands=[
              "echo \"=== Starting SEIF Backend Deployment ===\"",
              "cd /home/ubuntu/seif-backend || exit 1",
              "pm2 stop seif-backend || true",
              "echo \"Creating backup...\"",
              "mkdir -p /tmp/seif-backup",
              "cp -r /home/ubuntu/seif-backend /tmp/seif-backup/backend-$(date +%Y%m%d-%H%M%S) || true",
              "echo \"Downloading deployment package...\"",
              "aws s3 cp s3://${{ secrets.S3_BUCKET_NAME }}/deployments/backend-latest.tar.gz /tmp/backend-deploy.tar.gz",
              "echo \"Extracting files...\"",
              "rm -rf /home/ubuntu/seif-backend/*",
              "tar -xzf /tmp/backend-deploy.tar.gz -C /home/ubuntu/seif-backend",
              "cd /home/ubuntu/seif-backend",
              "echo \"Restarting PM2...\"",
              "pm2 restart seif-backend || pm2 start ecosystem.config.js",
              "pm2 save",
              "rm /tmp/backend-deploy.tar.gz",
              "echo \"=== Deployment completed successfully! ===\"",
              "pm2 list"
            ]' \
            --region ${{ env.AWS_REGION }} \
            --output text \
            --query 'Command.CommandId')

          echo "Command ID: $COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> $GITHUB_ENV

          echo "⏳ Waiting for deployment to complete..."
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ env.INSTANCE_ID }}" \
            --region ${{ env.AWS_REGION }}

          echo "✅ Deployment command completed!"

      - name: Get deployment output
        if: always()
        run: |
          if [ -n "${{ env.COMMAND_ID }}" ]; then
            echo "📋 Deployment Output:"
            aws ssm get-command-invocation \
              --command-id "${{ env.COMMAND_ID }}" \
              --instance-id "${{ env.INSTANCE_ID }}" \
              --region ${{ env.AWS_REGION }} \
              --query '[Status,StandardOutputContent,StandardErrorContent]' \
              --output text
          fi

      - name: Verify deployment
        run: |
          echo "⏳ Waiting for backend to start..."
          sleep 15

          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.EC2_HOST }}:5000/health || echo "000")

          if [ "$RESPONSE" = "200" ]; then
            echo "✅ Backend health check passed!"
            echo "🔗 Backend URL: http://${{ secrets.EC2_HOST }}:5000"
          else
            echo "❌ Backend health check failed (HTTP $RESPONSE)"
            exit 1
          fi

      - name: Rollback on failure
        if: failure() && env.COMMAND_ID
        run: |
          echo "⚠️ Deployment failed! Attempting rollback..."

          ROLLBACK_CMD=$(aws ssm send-command \
            --instance-ids "${{ env.INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "SEIF Backend Rollback" \
            --parameters 'commands=[
              "cd /home/ubuntu",
              "LATEST_BACKUP=$(ls -t /tmp/seif-backup/ | head -1)",
              "if [ -d \"/tmp/seif-backup/$LATEST_BACKUP\" ]; then",
              "  echo \"Rolling back to $LATEST_BACKUP\"",
              "  rm -rf /home/ubuntu/seif-backend",
              "  cp -r /tmp/seif-backup/$LATEST_BACKUP /home/ubuntu/seif-backend",
              "  cd /home/ubuntu/seif-backend",
              "  pm2 restart seif-backend",
              "  echo \"✅ Rollback completed\"",
              "else",
              "  echo \"⚠️ No backup found for rollback\"",
              "fi"
            ]' \
            --region ${{ env.AWS_REGION }} \
            --output text \
            --query 'Command.CommandId')

          echo "Rollback Command ID: $ROLLBACK_CMD"

          # Wait for rollback
          aws ssm wait command-executed \
            --command-id "$ROLLBACK_CMD" \
            --instance-id "${{ env.INSTANCE_ID }}" \
            --region ${{ env.AWS_REGION }}

          echo "Rollback completed"

      - name: Deployment summary
        if: always()
        run: |
          echo "### 🚀 Backend Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Method:** AWS Systems Manager (Secure, No SSH)" >> $GITHUB_STEP_SUMMARY
          echo "- **Instance:** ${{ env.INSTANCE_ID }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ **Result:** Deployment successful!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🔗 **Backend URL:** http://${{ secrets.EC2_HOST }}:5000" >> $GITHUB_STEP_SUMMARY
            echo "🔗 **Health Check:** http://${{ secrets.EC2_HOST }}:5000/health" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Result:** Deployment failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Check the logs above for details." >> $GITHUB_STEP_SUMMARY
          fi
