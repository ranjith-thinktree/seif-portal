name: Deploy Backend to EC2 (SSM)

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy-ssm.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2 via SSM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci --production --legacy-peer-deps

      - name: Create .env file
        working-directory: ./backend
        run: |
          cat > .env << EOF
          # Database Configuration
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=3306
          DB_NAME=seif
          DB_USER=admin
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}

          # JWT Configuration
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_EXPIRY=24h
          REFRESH_TOKEN_EXPIRY=7d

          # Server Configuration
          PORT=5000
          NODE_ENV=production
          FRONTEND_URL=http://seif-portal-frontend.s3-website.ap-south-2.amazonaws.com

          # Email Configuration
          SMTP_HOST=smtp.gmail.com
          SMTP_PORT=587
          SMTP_SECURE=false
          SMTP_USER=${{ secrets.GMAIL_USER }}
          SMTP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_FROM=${{ secrets.GMAIL_USER }}

          # File Upload Configuration
          UPLOAD_DIR=./uploads
          MAX_FILE_SIZE=10485760

          # CORS
          ALLOWED_ORIGINS=http://seif-portal-frontend.s3-website.ap-south-2.amazonaws.com
          EOF

      - name: Create deployment package
        run: |
          cd backend
          tar -czf ../backend-deploy.tar.gz \
            --exclude='logs' \
            --exclude='uploads' \
            --exclude='.git' \
            --exclude='*.log' \
            .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-2

      - name: Upload to S3 (temporary storage)
        run: |
          aws s3 cp backend-deploy.tar.gz s3://seif-portal-backend/deployments/backend-$(date +%Y%m%d-%H%M%S).tar.gz
          aws s3 cp backend-deploy.tar.gz s3://seif-portal-backend/deployments/backend-latest.tar.gz

      - name: Deploy via AWS Systems Manager
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=ip-address,Values=${{ secrets.EC2_HOST }}" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)

          echo "Instance ID: $INSTANCE_ID"

          # Create deployment script (NO EMOJIS - they cause encoding issues in AWS CLI)
          cat > deploy-backend.sh << 'DEPLOY_SCRIPT'
          #!/bin/bash
          set -e
          
          echo "[DEPLOY] Starting backend deployment..."
          
          # Set HOME for PM2
          export HOME=/home/ubuntu
          export PATH=$PATH:/home/ubuntu/.nvm/versions/node/v20.18.0/bin
          
          # Stop existing backend (don't fail if not running)
          echo "[DEPLOY] Stopping existing backend..."
          pm2 stop seif-backend 2>/dev/null || echo "Backend not running, skipping stop"
          pm2 delete seif-backend 2>/dev/null || echo "No existing PM2 process"
          
          # Clean old deployment
          echo "[DEPLOY] Cleaning old deployment..."
          rm -rf /home/ubuntu/seif-backend-new
          mkdir -p /home/ubuntu/seif-backend-new
          cd /home/ubuntu/seif-backend-new
          
          # Download from S3
          echo "[DEPLOY] Downloading deployment package from S3..."
          aws s3 cp s3://seif-portal-backend/deployments/backend-latest.tar.gz /tmp/backend-deploy.tar.gz
          
          if [ ! -f /tmp/backend-deploy.tar.gz ]; then
            echo "[ERROR] Failed to download deployment package from S3"
            exit 1
          fi
          
          # Extract files
          echo "[DEPLOY] Extracting deployment package..."
          tar -xzf /tmp/backend-deploy.tar.gz -C /home/ubuntu/seif-backend-new
          
          # Verify extraction
          echo "[DEPLOY] Verifying deployment..."
          if [ ! -d "/home/ubuntu/seif-backend-new/src" ]; then
            echo "[ERROR] src directory not found after extraction"
            ls -la /home/ubuntu/seif-backend-new/
            exit 1
          fi
          
          FILE_COUNT=$(find /home/ubuntu/seif-backend-new/src -type f 2>/dev/null | wc -l)
          echo "[DEPLOY] Files extracted: $FILE_COUNT"
          
          if [ "$FILE_COUNT" -lt 10 ]; then
            echo "[ERROR] Deployment verification failed - only $FILE_COUNT files found"
            exit 1
          fi
          
          # Verify .env file exists
          if [ ! -f "/home/ubuntu/seif-backend-new/.env" ]; then
            echo "[ERROR] .env file not found in deployment package"
            ls -la /home/ubuntu/seif-backend-new/
            exit 1
          fi
          
          echo "[DEPLOY] .env file verified"
          
          # Backup old deployment
          if [ -d "/home/ubuntu/seif-backend" ]; then
            echo "[DEPLOY] Backing up old deployment..."
            rm -rf /home/ubuntu/seif-backend-backup
            mv /home/ubuntu/seif-backend /home/ubuntu/seif-backend-backup
          fi
          
          # Move new deployment
          echo "[DEPLOY] Activating new deployment..."
          mv /home/ubuntu/seif-backend-new /home/ubuntu/seif-backend
          
          # Ensure logs directory exists
          mkdir -p /home/ubuntu/seif-backend/logs
          
          # Start backend with PM2
          echo "[DEPLOY] Starting backend with PM2..."
          cd /home/ubuntu/seif-backend
          pm2 start src/server.js --name seif-backend --time --log /home/ubuntu/seif-backend/logs/pm2.log
          pm2 save
          
          # Wait for startup
          echo "[DEPLOY] Waiting for backend to start..."
          sleep 10
          
          # Check PM2 status
          echo "[DEPLOY] PM2 status:"
          pm2 list
          
          # Health check with retries
          echo "[DEPLOY] Running health check..."
          HEALTH_CHECK_PASSED=0
          for i in {1..15}; do
            if curl -f http://localhost:5000/health 2>/dev/null; then
              echo "[SUCCESS] Health check passed on attempt $i!"
              HEALTH_CHECK_PASSED=1
              break
            fi
            echo "[DEPLOY] Health check attempt $i/15 failed, retrying in 3 seconds..."
            sleep 3
          done
          
          if [ "$HEALTH_CHECK_PASSED" -eq 0 ]; then
            echo "[ERROR] Health check failed after 15 attempts"
            echo "[ERROR] PM2 logs (last 50 lines):"
            pm2 logs seif-backend --lines 50 --nostream || cat /home/ubuntu/seif-backend/logs/pm2.log | tail -50
            exit 1
          fi
          
          # Cleanup
          rm -f /tmp/backend-deploy.tar.gz
          echo "[SUCCESS] Deployment completed successfully!"
          exit 0
          DEPLOY_SCRIPT

          # Upload deployment script to S3
          aws s3 cp deploy-backend.sh s3://seif-portal-backend/scripts/deploy-backend.sh

          # Execute deployment via SSM
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters commands='["aws s3 cp s3://seif-portal-backend/scripts/deploy-backend.sh /tmp/deploy-backend.sh","chmod +x /tmp/deploy-backend.sh","bash /tmp/deploy-backend.sh 2>&1"]' \
            --timeout-seconds 600 \
            --output text \
            --query 'Command.CommandId')

          echo "Command ID: $COMMAND_ID"

          # Wait for command to complete (10 min timeout)
          echo "Waiting for deployment to complete (this may take up to 10 minutes)..."
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --cli-read-timeout 600

          # Check command status
          COMMAND_STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'Status' \
            --output text)

          echo "Command Status: $COMMAND_STATUS"

          if [ "$COMMAND_STATUS" != "Success" ]; then
            echo "Deployment failed. Fetching logs..."
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'StandardErrorContent' \
              --output text || echo "Could not fetch error logs"
            exit 1
          fi

          echo "Deployment completed successfully!"

      - name: Verify deployment
        run: |
          sleep 10
          curl -f http://${{ secrets.EC2_HOST }}:5000/health || exit 1

      - name: Deployment summary
        if: always()
        run: |
          echo "### Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Backend deployed via AWS Systems Manager" >> $GITHUB_STEP_SUMMARY
          echo "- No SSH required!" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
