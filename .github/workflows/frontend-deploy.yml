name: Deploy Frontend to S3

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-deploy.yml"
  workflow_dispatch: # Manual trigger option

jobs:
  deploy:
    name: Build and Deploy to S3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Create production .env
        run: |
          cd frontend
          cat > .env << EOF
          VITE_API_URL=http://18.61.83.249:5000/api/v1
          VITE_APP_NAME=SEIF Portal
          VITE_APP_VERSION=1.0.0
          EOF

      - name: Build frontend
        run: |
          cd frontend
          echo "🏗️  Building production bundle..."
          npm run build
          echo "✅ Build completed successfully"

          # Show build size
          du -sh dist
          echo ""
          echo "📦 Build contents:"
          ls -lh dist/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-2

      - name: Deploy to S3
        run: |
          cd frontend
          echo "📤 Uploading to S3 bucket: ${{ secrets.S3_BUCKET_NAME }}"

          # Sync files to S3 with proper cache headers
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET_NAME }} \
            --delete \
            --cache-control "public,max-age=31536000" \
            --exclude "index.html" \
            --exclude "*.txt"

          # Upload index.html with no-cache
          aws s3 cp dist/index.html s3://${{ secrets.S3_BUCKET_NAME }}/index.html \
            --cache-control "no-cache,no-store,must-revalidate"

          # Upload manifest/txt files
          if [ -f dist/manifest.json ]; then
            aws s3 cp dist/manifest.json s3://${{ secrets.S3_BUCKET_NAME }}/manifest.json \
              --cache-control "no-cache"
          fi

          if [ -f dist/robots.txt ]; then
            aws s3 cp dist/robots.txt s3://${{ secrets.S3_BUCKET_NAME }}/robots.txt \
              --cache-control "no-cache"
          fi

          echo "✅ Upload completed successfully"

      - name: Invalidate CloudFront cache (optional)
        if: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          echo "🔄 Invalidating CloudFront cache..."
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
          echo "✅ Cache invalidation triggered"

      - name: Verify deployment
        run: |
          echo "🔍 Verifying S3 deployment..."

          # Check if index.html exists
          if aws s3 ls s3://${{ secrets.S3_BUCKET_NAME }}/index.html; then
            echo "✅ index.html found"
          else
            echo "❌ index.html not found!"
            exit 1
          fi

          # List bucket contents
          echo ""
          echo "📦 Bucket contents:"
          aws s3 ls s3://${{ secrets.S3_BUCKET_NAME }}/ --human-readable --summarize

      - name: Deployment summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Frontend deployed successfully to S3!"
            echo "🔗 Website URL: http://${{ secrets.S3_BUCKET_NAME }}.s3-website.ap-south-2.amazonaws.com"
            echo ""
            echo "💡 Tips:"
            echo "- Hard refresh (Ctrl+F5) to see changes"
            echo "- Clear browser cache if old version persists"
            echo "- Check browser console for any errors"
          else
            echo "❌ Frontend deployment failed"
            echo "Check the logs above for details"
          fi
