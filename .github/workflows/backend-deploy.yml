name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch: # Manual trigger option

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
          cd backend
          npm ci --production

      - name: Create .env file
        run: |
          cd backend
          cat > .env << EOF
          # Database Configuration
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=3306
          DB_NAME=seif
          DB_USER=admin
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}

          # JWT Configuration
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_EXPIRY=24h
          REFRESH_TOKEN_EXPIRY=7d

          # Server Configuration
          PORT=5000
          NODE_ENV=production
          FRONTEND_URL=http://seif-portal-frontend.s3-website.ap-south-2.amazonaws.com

          # Email Configuration (Gmail)
          SMTP_HOST=smtp.gmail.com
          SMTP_PORT=587
          SMTP_SECURE=false
          SMTP_USER=${{ secrets.GMAIL_USER }}
          SMTP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_FROM=${{ secrets.GMAIL_USER }}

          # File Upload Configuration
          UPLOAD_DIR=./uploads
          MAX_FILE_SIZE=10485760

          # CORS
          ALLOWED_ORIGINS=http://seif-portal-frontend.s3-website.ap-south-2.amazonaws.com
          EOF

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Create backup on EC2
        run: |
          ssh ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
            cd /home/ubuntu/seif-portal
            if [ -d backend_backup ]; then
              rm -rf backend_backup
            fi
            if [ -d backend ]; then
              cp -r backend backend_backup
              echo "✅ Backup created"
            fi
          ENDSSH

      - name: Deploy to EC2
        run: |
          echo "📦 Syncing files to EC2..."
          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude 'logs/*' \
            --exclude 'uploads/*' \
            --exclude 'coverage' \
            --exclude '.env' \
            backend/ ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/home/ubuntu/seif-portal/backend/
          
          echo "✅ Files synced successfully"

      - name: Install dependencies and restart on EC2
        run: |
          ssh ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
            set -e
            cd /home/ubuntu/seif-portal/backend
            
            echo "📦 Installing dependencies..."
            npm ci --production
            
            echo "🔄 Restarting PM2 process..."
            if pm2 describe seif-backend > /dev/null 2>&1; then
              pm2 restart seif-backend
            else
              pm2 start src/server.js --name seif-backend
            fi
            
            pm2 save
            echo "✅ Backend restarted successfully"
          ENDSSH

      - name: Verify deployment
        run: |
          echo "⏳ Waiting for backend to start..."
          sleep 15
          
          ssh ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
            echo "📊 PM2 Status:"
            pm2 list
            
            echo ""
            echo "📝 Recent logs:"
            pm2 logs seif-backend --lines 20 --nostream
            
            echo ""
            echo "✅ Backend deployment verification complete"
          ENDSSH

      - name: Rollback on failure
        if: failure()
        run: |
          echo "❌ Deployment failed! Rolling back..."
          ssh ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
            cd /home/ubuntu/seif-portal
            if [ -d backend_backup ]; then
              rm -rf backend
              mv backend_backup backend
              pm2 restart seif-backend
              echo "✅ Rollback completed"
            else
              echo "⚠️  No backup found"
            fi
          ENDSSH

      - name: Deployment summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Backend deployed successfully to EC2!"
            echo "🔗 Backend URL: http://${{ secrets.EC2_HOST }}:5000"
            echo "🔗 Health Check: http://${{ secrets.EC2_HOST }}:5000/health"
          else
            echo "❌ Backend deployment failed"
            echo "Check the logs above for details"
          fi
