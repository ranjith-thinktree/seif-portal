name: Deploy Backend to EC2 (SSM)

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy-ssm.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2 via SSM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci --production --legacy-peer-deps

      - name: Create .env file
        working-directory: ./backend
        run: |
          cat > .env << EOF
          # Database Configuration
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=3306
          DB_NAME=seif
          DB_USER=admin
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}

          # JWT Configuration
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_EXPIRY=24h
          REFRESH_TOKEN_EXPIRY=7d

          # Server Configuration
          PORT=5000
          NODE_ENV=production
          FRONTEND_URL=http://seif-portal-frontend.s3-website.ap-south-2.amazonaws.com

          # Email Configuration
          SMTP_HOST=smtp.gmail.com
          SMTP_PORT=587
          SMTP_SECURE=false
          SMTP_USER=${{ secrets.GMAIL_USER }}
          SMTP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_FROM=${{ secrets.GMAIL_USER }}

          # File Upload Configuration
          UPLOAD_DIR=./uploads
          MAX_FILE_SIZE=10485760

          # CORS
          ALLOWED_ORIGINS=http://seif-portal-frontend.s3-website.ap-south-2.amazonaws.com
          EOF

      - name: Create deployment package
        run: |
          cd backend
          tar -czf ../backend-deploy.tar.gz \
            --exclude='logs' \
            --exclude='uploads' \
            --exclude='.git' \
            --exclude='*.log' \
            .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-2

      - name: Upload to S3 (temporary storage)
        run: |
          aws s3 cp backend-deploy.tar.gz s3://seif-portal-backend/deployments/backend-$(date +%Y%m%d-%H%M%S).tar.gz
          aws s3 cp backend-deploy.tar.gz s3://seif-portal-backend/deployments/backend-latest.tar.gz

      - name: Deploy via AWS Systems Manager
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=ip-address,Values=${{ secrets.EC2_HOST }}" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)

          echo "Instance ID: $INSTANCE_ID"

          # Create deployment script
          cat > deploy-backend.sh << 'DEPLOY_SCRIPT'
          #!/bin/bash
          set -e
          
          echo "🚀 Starting backend deployment..."
          
          # Set HOME for PM2
          export HOME=/home/ubuntu
          
          # Stop existing backend (don't fail if not running)
          echo "⏸️  Stopping existing backend..."
          pm2 stop seif-backend 2>/dev/null || echo "Backend not running, skipping stop"
          
          # Create deployment directory
          echo "📁 Creating deployment directory..."
          mkdir -p /home/ubuntu/seif-backend-new
          cd /home/ubuntu/seif-backend-new
          
          # Download from S3
          echo "⬇️  Downloading deployment package from S3..."
          aws s3 cp s3://seif-portal-backend/deployments/backend-latest.tar.gz /tmp/backend-deploy.tar.gz
          
          # Extract files
          echo "📦 Extracting deployment package..."
          tar -xzf /tmp/backend-deploy.tar.gz -C /home/ubuntu/seif-backend-new
          
          # Verify extraction
          echo "✅ Verifying deployment..."
          FILE_COUNT=$(find /home/ubuntu/seif-backend-new/src -type f 2>/dev/null | wc -l)
          echo "   Files extracted: $FILE_COUNT"
          
          if [ "$FILE_COUNT" -lt 20 ]; then
            echo "❌ ERROR: Deployment verification failed - only $FILE_COUNT files found"
            exit 1
          fi
          
          # Backup old deployment
          if [ -d "/home/ubuntu/seif-backend" ]; then
            echo "💾 Backing up old deployment..."
            rm -rf /home/ubuntu/seif-backend-backup
            mv /home/ubuntu/seif-backend /home/ubuntu/seif-backend-backup
          fi
          
          # Move new deployment
          echo "🔄 Activating new deployment..."
          mv /home/ubuntu/seif-backend-new /home/ubuntu/seif-backend
          
          # Start backend with PM2
          echo "▶️  Starting backend..."
          cd /home/ubuntu/seif-backend
          pm2 restart seif-backend || pm2 start src/server.js --name seif-backend -i 1 --watch false
          pm2 save
          
          # Wait for startup
          echo "⏳ Waiting for backend to start..."
          sleep 8
          
          # Health check
          echo "🏥 Running health check..."
          for i in {1..10}; do
            if curl -f http://localhost:5000/health 2>/dev/null; then
              echo "✅ Health check passed!"
              rm -f /tmp/backend-deploy.tar.gz
              echo "🎉 Deployment successful!"
              exit 0
            fi
            echo "   Attempt $i/10 failed, retrying..."
            sleep 2
          done
          
          echo "❌ Health check failed after 10 attempts"
          echo "📋 PM2 logs:"
          pm2 logs seif-backend --lines 20 --nostream
          exit 1
          DEPLOY_SCRIPT

          # Upload deployment script to S3
          aws s3 cp deploy-backend.sh s3://seif-portal-backend/scripts/deploy-backend.sh

          # Execute deployment via SSM
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters commands='["aws s3 cp s3://seif-portal-backend/scripts/deploy-backend.sh /tmp/deploy-backend.sh","chmod +x /tmp/deploy-backend.sh","bash /tmp/deploy-backend.sh"]' \
            --output text \
            --query 'Command.CommandId')

          echo "Command ID: $COMMAND_ID"

          # Wait for command to complete (increased timeout)
          echo "Waiting for deployment to complete..."
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --cli-read-timeout 300

          # Get command output
          echo "Deployment output:"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent,StandardErrorContent]' \
            --output text

      - name: Verify deployment
        run: |
          sleep 10
          curl -f http://${{ secrets.EC2_HOST }}:5000/health || exit 1

      - name: Deployment summary
        if: always()
        run: |
          echo "### Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Backend deployed via AWS Systems Manager" >> $GITHUB_STEP_SUMMARY
          echo "- No SSH required!" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
