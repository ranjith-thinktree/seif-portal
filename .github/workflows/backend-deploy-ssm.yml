name: Deploy Backend to EC2 (SSM)

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy-ssm.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2 via SSM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci --production --legacy-peer-deps

      - name: Create deployment package
        run: |
          cd backend
          tar -czf ../backend-deploy.tar.gz \
            --exclude='logs' \
            --exclude='uploads' \
            --exclude='.git' \
            --exclude='*.log' \
            .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-2

      - name: Upload to S3 (temporary storage)
        run: |
          aws s3 cp backend-deploy.tar.gz s3://${{ secrets.S3_BUCKET_NAME }}/deployments/backend-$(date +%Y%m%d-%H%M%S).tar.gz
          aws s3 cp backend-deploy.tar.gz s3://${{ secrets.S3_BUCKET_NAME }}/deployments/backend-latest.tar.gz

      - name: Deploy via AWS Systems Manager
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=ip-address,Values=${{ secrets.EC2_HOST }}" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)

          echo "Instance ID: $INSTANCE_ID"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "mkdir -p /home/ubuntu/seif-backend",
              "cd /home/ubuntu/seif-backend",
              "pm2 stop seif-backend || true",
              "aws s3 cp s3://${{ secrets.S3_BUCKET_NAME }}/deployments/backend-latest.tar.gz /tmp/backend-deploy.tar.gz",
              "tar -xzf /tmp/backend-deploy.tar.gz -C /home/ubuntu/seif-backend",
              "FILE_COUNT=\$(find /home/ubuntu/seif-backend/src -type f | wc -l)",
              "if [ \"\$FILE_COUNT\" -lt 50 ]; then echo \"Deployment verification failed\"; exit 1; fi",
              "cd /home/ubuntu/seif-backend",
              "pm2 restart seif-backend || pm2 start ecosystem.config.js --name seif-backend",
              "pm2 save",
              "sleep 5",
              "curl -f http://localhost:5000/health || exit 1",
              "rm /tmp/backend-deploy.tar.gz"
            ]' \
            --output text \
            --query 'Command.CommandId')

          echo "Command ID: $COMMAND_ID"

          # Wait for command to complete
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          # Get command output
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

      - name: Verify deployment
        run: |
          sleep 10
          curl -f http://${{ secrets.EC2_HOST }}:5000/health || exit 1

      - name: Deployment summary
        if: always()
        run: |
          echo "### Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Backend deployed via AWS Systems Manager" >> $GITHUB_STEP_SUMMARY
          echo "- No SSH required!" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
